[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modern-greek-backend-eee"
version = "1.0.0"
description = "Modern Greek morphology backend for the EEE project"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Oleg Sadov", email = "oleg.sadov@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "modern-greek-inflexion-eee>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/EEE-project/modern-greek-backend-eee"
Repository = "https://github.com/EEE-project/modern-greek-backend-eee"

[dependency-groups]
dev = [
    "pytest",
    "eee-project @ git+https://codeberg.org/EEE-project/eee-project.git",
]

[project.entry-points."eee_project.backends.v1"]
el = "modern_greek_backend_eee:ModernGreekBackend"

[project.entry-points."eee_project.named_backends.v1"]
modern-greek = "modern_greek_backend_eee:ModernGreekBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_greek_backend_eee"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
